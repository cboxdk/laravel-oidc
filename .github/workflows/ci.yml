name: ci

on:
  push:
    branches: [main]
    # Release tags too, so the SBOM dependency-set gate below runs where an
    # accurate supply-chain record matters.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        # Laravel 12 (testbench 10) and Laravel 13 (testbench 11).
        testbench: ["^10.0", "^11.0"]
    name: PHP ${{ matrix.php }} · testbench ${{ matrix.testbench }}
    steps:
      # Actions are pinned to commit SHAs, with the tag as a comment; Dependabot
      # keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, sodium, gmp
          coverage: none
          tools: composer:v2
      - name: Pin the Laravel major
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: composer validate
        run: composer validate --strict
      - name: Pint (lint)
        run: vendor/bin/pint --test
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github
      - name: Pest
        run: vendor/bin/pest
      - name: Security audit
        run: composer audit --no-dev
      - name: License compliance
        run: composer license-check
      # The SBOM is derived from composer.lock, which differs per Laravel major,
      # so it is only generated on the canonical cell (latest major).
      - name: SBOM
        if: matrix.php == '8.4' && matrix.testbench == '^11.0'
        run: composer sbom
      # composer.lock is not committed (this is a library), so CI resolves fresh
      # and picks up upstream patch releases. Compare the dependency SET, not the
      # versions: a dependency added or removed without regenerating sbom.json
      # fails a release tag; patch drift does not.
      - name: SBOM dependency set is up to date (release tags)
        if: matrix.php == '8.4' && matrix.testbench == '^11.0' && startsWith(github.ref, 'refs/tags/')
        run: |
          git show HEAD:sbom.json > /tmp/sbom-committed.json
          jq -r '[.components[].name] | sort | .[]' /tmp/sbom-committed.json > /tmp/set-committed.txt
          jq -r '[.components[].name] | sort | .[]' sbom.json > /tmp/set-resolved.txt
          if ! diff -u /tmp/set-committed.txt /tmp/set-resolved.txt; then
            echo "::error::sbom.json lists a different dependency SET than this release resolves. Run 'composer sbom' and commit before tagging."
            exit 1
          fi
      - name: SBOM drift (informational)
        if: matrix.php == '8.4' && matrix.testbench == '^11.0' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git diff --quiet sbom.json \
            || echo "::notice::sbom.json drifted from the current resolve (usually an upstream patch release). Run 'composer sbom' before the next tag."
      - name: Upload SBOM
        if: matrix.php == '8.4' && matrix.testbench == '^11.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json

  # Line coverage of src, held at 99% so a security branch without a test
  # cannot slip in unnoticed.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Coverage (PHP 8.4 · testbench ^11.0)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: openssl, sodium, gmp
          coverage: pcov
          tools: composer:v2
      - name: Pin the Laravel major
        run: composer require "orchestra/testbench:^11.0" --dev --no-update --no-interaction
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: Pest with coverage
        run: composer test:coverage
