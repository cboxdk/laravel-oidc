name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so advisories that land after a release are still surfaced.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Dependency vulnerability scan against the PHP Security Advisories database.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: openssl, sodium
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: composer audit
        run: composer audit --no-dev

  # Secret scanning. A leaked signing key or client secret is the worst
  # failure mode for an authentication library.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --only-verified

  # Static application security testing. Findings go to the Security tab as
  # SARIF rather than failing the build, so triage happens in review.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep scan
        run: semgrep scan --config=p/php --config=p/security-audit --config=p/secrets --sarif --output=semgrep.sarif
        continue-on-error: true
      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
        if: always()
