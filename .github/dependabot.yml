version: 2
updates:
  # Composer dependencies: security and version updates.
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev-tooling bumps into one PR.
      dev-tooling:
        dependency-type: development

  # GitHub Actions: keeps the pinned action SHAs (and their tag comments)
  # current, so a moved tag cannot change what the build runs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
